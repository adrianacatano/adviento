<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calendario de Adviento</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style id="css">
:root{
  --night1:#0b1517; --night2:#132629; --night3:#1d3537;
  --amber1:#ffe7a8; --amber2:#f6bd55; --amber3:#d98a2b;
  --cream:#f3ead7; --paper:#f4ecdc; --gold:#d9a441; --red:#a83e2c; --teal:#5f8f86; --fir:#1e3b33; --ink:#1c2422;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none;background:var(--night1)}
body{background:
  radial-gradient(60% 18% at 75% 22%, rgba(70,110,110,.28), transparent 70%),
  radial-gradient(50% 14% at 20% 30%, rgba(70,110,110,.18), transparent 70%),
  linear-gradient(to bottom, var(--night1) 0%, var(--night2) 55%, var(--night3) 100%)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:3}
header{position:fixed;top:0;left:0;right:0;z-index:5;text-align:center;padding:18px 16px 0;pointer-events:none}
header h1{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:clamp(23px,6.4vw,36px);margin:0;color:var(--cream);text-shadow:0 2px 20px rgba(246,189,85,.25)}
header p{margin:5px 0 0;font-size:14px;color:rgba(243,234,215,.75);font-family:"Playfair Display",Georgia,serif;font-style:italic}
header .pill{display:inline-block;margin-top:9px;padding:5px 13px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:13px;background:rgba(217,164,65,.08)}
footer{position:fixed;bottom:0;left:0;right:0;z-index:5;text-align:center;padding:0 16px 18px;font-size:13px;color:rgba(243,234,215,.6);pointer-events:none}
#editBtn{position:fixed;top:14px;right:14px;z-index:6;border:0;border-radius:99px;padding:8px 12px;font:800 13px Nunito,sans-serif;background:rgba(243,234,215,.14);color:var(--cream);display:none;backdrop-filter:blur(6px)}
#editBar{position:fixed;left:12px;right:12px;bottom:14px;z-index:6;display:none;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#editBar button{border:0;border-radius:99px;padding:7px 11px;font:800 12px Nunito,sans-serif;background:var(--ink);color:var(--cream)}
body.editing #editBar{display:flex}
body.editing footer{display:none}

.scene{position:fixed;inset:0;z-index:2;perspective:1300px;perspective-origin:50% 42%;touch-action:none;cursor:grab}
.stage{position:absolute;left:50%;top:55%;transform-style:preserve-3d}
.house{position:absolute;width:var(--W);height:var(--H);transform-style:preserve-3d}
.house > *{position:absolute;left:0;top:0}

/* Fachadas de piedra oscura */
.wall{width:var(--W);height:var(--H);transform-style:preserve-3d;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,var(--F));
  background:
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--F) - 10px), #eef0ec calc(var(--F) - 10px) calc(var(--F) - 7px), var(--stone) calc(var(--F) - 7px) calc(var(--F) - 2px), rgba(0,0,0,.4) calc(var(--F) - 2px) var(--F)),
    linear-gradient(90deg, rgba(255,255,255,.06) 0 5%, rgba(0,0,0,.18) 5% 5.6%, transparent 5.6% 94.4%, rgba(0,0,0,.18) 94.4% 95%, rgba(255,255,255,.06) 95%),
    linear-gradient(90deg, transparent calc(50% - 4px), rgba(255,255,255,.035) calc(50% - 4px) calc(50% + 4px), transparent calc(50% + 4px)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 15px),
    linear-gradient(to bottom, var(--wall), var(--wall2))}
.wall .cell{display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;position:relative}
.wall .cell.gfloor{align-items:flex-end;justify-content:space-evenly;grid-column:1 / span 2;padding-bottom:0}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.wall .shade{transform:translateZ(8px)}
.roof .shade{transform:translateZ(1px)}
.eave{position:absolute;left:0;right:0;top:0;height:9px;transform:translateZ(2px);background:repeating-linear-gradient(90deg, var(--stone) 0 5px, rgba(0,0,0,.35) 5px 9px);border-bottom:2px solid rgba(0,0,0,.35)}

/* Ventanas francesas iluminadas */
.win{position:relative;width:calc(var(--W)*.27);height:calc(var(--F)*.64);transform-style:preserve-3d;transform:translateZ(1px);cursor:pointer;margin-top:4px}
.win::before{content:"";position:absolute;left:-6px;right:-6px;top:-11px;height:8px;transform:translateZ(3px);background:var(--stone);border-top:3px solid #f1f3ef;border-radius:3px 3px 0 0;box-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.win::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-8px;height:7px;background:#f4f5f1;border-radius:5px 5px 2px 2px;transform:translateZ(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.win .room{position:absolute;inset:0;border:3px solid #141817;
  background:radial-gradient(circle at 50% 60%, var(--amber1) 0%, var(--amber2) 50%, var(--amber3) 100%);background-size:cover;background-position:center;
  box-shadow:0 0 16px rgba(246,189,85,.45);display:flex;align-items:center;justify-content:center;font-size:calc(var(--W)*.085)}
.sh{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);transform-style:preserve-3d;transform:translateZ(1px);transition:transform 1.1s cubic-bezier(.25,1.2,.45,1)}
.sh.l{left:3px;transform-origin:left center}
.sh.r{right:3px;transform-origin:right center}
/* Ventana ya abierta: cristal limpio y, detrás, lo que hay dentro */
.win .thumb{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
.win .thumb.qr{background-color:#fff;background-size:78%;background-repeat:no-repeat}
.win .note{display:none;width:58%;height:64%;border-radius:2px;transform:rotate(-5deg);box-shadow:0 2px 4px rgba(0,0,0,.35);
  background:linear-gradient(#fbf6ea 0 20%, transparent 20%), repeating-linear-gradient(to bottom, #fbf6ea 0 4px, #8ea3b9 4px 5px)}
.win .note.link{background:linear-gradient(#fbf6ea 0 20%, transparent 20%), radial-gradient(circle at 78% 78%, #a83e2c 0 9%, transparent 10%), repeating-linear-gradient(to bottom, #fbf6ea 0 4px, #8ea3b9 4px 5px)}
.win.open .thumb{display:block}
.win.open .note{display:block}
.win.open .sh .f{background:
   linear-gradient(transparent 31%, #1a1e1d 31% 35%, transparent 35% 64%, #1a1e1d 64% 68%, transparent 68%),
   linear-gradient(90deg, transparent 46%, #1a1e1d 46% 54%, transparent 54%),
   linear-gradient(125deg, rgba(255,255,255,.3), rgba(255,255,255,0) 32%, rgba(255,255,255,.14) 50%, rgba(255,255,255,0) 62%)}
.win.door.open .sh.l{transform:translateZ(1px) rotateY(-42deg)}
.sh .f,.sh .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sh .f{background:
   linear-gradient(transparent 31%, #1a1e1d 31% 35%, transparent 35% 64%, #1a1e1d 64% 68%, transparent 68%),
   linear-gradient(90deg, transparent 46%, #1a1e1d 46% 54%, transparent 54%),
   var(--curtain),
   radial-gradient(circle at 50% 55%, var(--amber1), var(--amber2) 60%, var(--amber3));
   box-shadow:inset 0 0 0 2px #1a1e1d}
.sh.l .f{--curtain:linear-gradient(90deg, rgba(150,45,30,.75), rgba(180,70,45,.55) 55%, rgba(200,90,50,.15))}
.sh.r .f{--curtain:linear-gradient(270deg, rgba(150,45,30,.75), rgba(180,70,45,.55) 55%, rgba(200,90,50,.15))}
.wall[data-face="1"] .sh.l .f,.wall[data-face="3"] .sh.l .f{--curtain:linear-gradient(90deg, rgba(40,90,82,.75), rgba(70,120,110,.5) 55%, rgba(90,140,125,.12))}
.wall[data-face="1"] .sh.r .f,.wall[data-face="3"] .sh.r .f{--curtain:linear-gradient(270deg, rgba(40,90,82,.75), rgba(70,120,110,.5) 55%, rgba(90,140,125,.12))}
.sh .b{transform:rotateY(180deg);background:#24292a;box-shadow:inset 0 0 0 2px #121514}
.tag{position:absolute;left:50%;top:50%;width:calc(var(--W)*.12);height:calc(var(--W)*.12);margin:calc(var(--W)*-.06) 0 0 calc(var(--W)*-.06);border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f6dc93, var(--gold) 55%, #9c7124);border:2px solid #3b2a10;display:flex;align-items:center;justify-content:center;transform:translateZ(3px);
  font:800 calc(var(--W)*.056) "Playfair Display",Georgia,serif;color:#2a1d08;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:opacity .3s, transform .3s;pointer-events:none}
.win.open .tag{opacity:0;transform:translateZ(3px) scale(.5)}
.win.today .tag{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(217,164,65,.45), 0 0 18px rgba(246,189,85,.8)}}
.win.wiggle .sh.l{animation:wl .5s}.win.wiggle .sh.r{animation:wr .5s}
@keyframes wl{30%{transform:translateZ(1px) rotateY(-14deg)}60%{transform:translateZ(1px) rotateY(-5deg)}100%{transform:translateZ(1px) rotateY(0)}}
@keyframes wr{30%{transform:translateZ(1px) rotateY(14deg)}60%{transform:translateZ(1px) rotateY(5deg)}100%{transform:translateZ(1px) rotateY(0)}}

/* Planta baja: tiendas con toldo y puerta (día 25) */
.awning{position:absolute;left:3%;right:3%;top:8px;height:15px;transform:translateZ(5px);pointer-events:none;
  background:repeating-linear-gradient(90deg, #e9e1cf 0 9px, var(--awn) 9px 18px);
  -webkit-mask:radial-gradient(5px at 50% 100%, #0000 97%, #000) 50% / 10px 100%;mask:radial-gradient(5px at 50% 100%, #0000 97%, #000) 50% / 10px 100%;
  box-shadow:0 3px 0 rgba(0,0,0,.25)}
.awning::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#fff}
.shop{position:relative;width:calc(var(--W)*.26);height:calc(var(--F)*.56);margin-bottom:5px;transform:translateZ(1px);border:3px solid #141817;
  background:linear-gradient(90deg, transparent calc(50% - 1.5px), #141817 calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
    radial-gradient(circle at 50% 70%, var(--amber1), var(--amber2) 55%, var(--amber3));box-shadow:0 0 16px rgba(246,189,85,.45)}
.shop.wide{width:calc(var(--W)*.62);background:
    linear-gradient(90deg, transparent calc(33.3% - 1.5px), #141817 calc(33.3% - 1.5px) calc(33.3% + 1.5px), transparent calc(33.3% + 1.5px) calc(66.6% - 1.5px), #141817 calc(66.6% - 1.5px) calc(66.6% + 1.5px), transparent calc(66.6% + 1.5px)),
    radial-gradient(circle at 50% 70%, var(--amber1), var(--amber2) 55%, var(--amber3))}
.shop svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:70%}
.win.door{width:calc(var(--W)*.25);height:calc(var(--F)*.74);margin:0}
.win.door::before{top:-10px}
.win.door::after{bottom:-5px;height:5px;left:-12px;right:-12px}
.win.door .room{border-bottom:0}
.win.door .sh.l{width:auto;right:3px;bottom:0;top:28%}
.win.door .sh.l .f{background:linear-gradient(transparent 0 0), #1f3b33;box-shadow:inset 0 0 0 2px #10201b, inset 0 0 0 7px #1f3b33, inset 0 0 0 8px rgba(255,255,255,.12)}
.win.door .sh.l .f::before{content:"";position:absolute;top:10%;left:50%;width:50%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  border:5px solid #2f5a45;box-shadow:0 0 0 1px #142a20, inset 0 0 0 1px #142a20;background:radial-gradient(circle,#c4432f 1.5px,transparent 2px) 0 0/7px 7px}
.win.door .sh.l .f::after{content:"";position:absolute;right:12%;top:62%;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.win.door .room::after{content:"";position:absolute;left:0;right:0;top:27%;height:2px;background:#141817}
.win.door .tag{top:78%}

/* Tejado mansarda nevado */
.roof{width:calc(var(--W)*1.12);left:calc(var(--W)*-.06) !important;height:var(--S);top:calc(var(--S)*-1) !important;transform-origin:50% 100%;
  clip-path:polygon(var(--ins) 0, calc(100% - var(--ins)) 0, 100% 100%, 0 100%);
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 13px),
    linear-gradient(to bottom, #f4f5f2, #d7dcd9 70%, #b9c1be)}
.roof .rim{position:absolute;left:0;right:0;bottom:0;height:7px;background:#3b4443;border-top:3px solid #f4f5f2}
.dormer{position:absolute;bottom:22%;width:14%;height:38%;background:radial-gradient(circle at 50% 60%, var(--amber1), var(--amber2) 60%, var(--amber3));border:3px solid #2a3130;box-shadow:0 0 10px rgba(246,189,85,.5)}
.dormer::before{content:"";position:absolute;left:-30%;right:-30%;top:-45%;height:45%;background:#f4f5f2;clip-path:polygon(50% 0,100% 100%,0 100%)}
.dormer::after{content:"";position:absolute;left:46%;width:8%;top:0;bottom:0;background:#2a3130}
.rtop{background:#f6f7f4}
.chim{transform-style:preserve-3d}
.chim .cf{position:absolute;inset:0;background:linear-gradient(#f4f5f2 0 14%, #3b4443 14% 20%, transparent 20%), repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 7px), #2c3332}
.chim .cap{position:absolute;background:#f6f7f4;border-radius:2px}
.ground{width:calc(var(--W)*3.6);height:calc(var(--W)*3.6);left:calc(var(--W)*-1.3) !important;top:calc(var(--H) - var(--W)*1.8) !important;transform:rotateX(90deg);border-radius:50%;
  background:radial-gradient(circle, rgba(10,10,10,.55) 0%, rgba(255,214,150,.55) 15%, #ebe1cb 24%, #ddd3bd 42%, rgba(200,195,180,.35) 58%, rgba(29,53,55,0) 70%);pointer-events:none}
.prop{pointer-events:none;transform-origin:50% 100%}
.prop svg{width:100%;height:100%;display:block;overflow:visible}

/* Vista interior: zoom, cristales que se abren y la habitación */
#helpBtn{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:6;border:0;border-radius:99px;padding:10px 16px;font:800 14px Nunito,sans-serif;background:var(--gold);color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;white-space:nowrap;transition:opacity .4s}
body.editing #helpBtn{display:none !important}
.card ol{padding-left:20px;margin:6px 0 10px}.card ol li{margin-bottom:9px;line-height:1.45}.card .tip{background:#ebe0c8;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
body.zoomed header,body.zoomed footer,body.zoomed #helpBtn,body.zoomed #editBtn,body.zoomed #editBar{opacity:0;pointer-events:none}
header,footer,#editBtn{transition:opacity .4s}
#view{position:fixed;inset:0;z-index:8;visibility:hidden;opacity:0;transition:opacity .35s, visibility 0s .35s;perspective:1100px;overflow:hidden;background:#140d08}
#view.show{visibility:visible;opacity:1;transition:opacity .35s}
#view.fading{opacity:0}
#vroom{position:absolute;inset:0}
#vroom svg{width:100%;height:100%;display:block}
#vframe{position:absolute;inset:0;border:12px solid #141817;box-shadow:inset 0 0 50px rgba(0,0,0,.55);pointer-events:none}
.vglass{position:absolute;top:12px;bottom:12px;width:calc(50% - 12px);transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.3,1.05,.4,1)}
.vglass.l{left:12px;transform-origin:left center}
.vglass.r{right:12px;transform-origin:right center}
#view.opening .vglass.l{transform:rotateY(-100deg)}
#view.opening .vglass.r{transform:rotateY(100deg)}
.vglass .f,.vglass .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.vglass .f{background:
   linear-gradient(transparent calc(33% - 5px), #1a1e1d calc(33% - 5px) calc(33% + 5px), transparent calc(33% + 5px) calc(66% - 5px), #1a1e1d calc(66% - 5px) calc(66% + 5px), transparent calc(66% + 5px)),
   linear-gradient(90deg, transparent calc(50% - 5px), #1a1e1d calc(50% - 5px) calc(50% + 5px), transparent calc(50% + 5px)),
   repeating-linear-gradient(90deg, rgba(0,0,0,.13) 0 6px, transparent 6px 24px),
   var(--curtain),
   radial-gradient(circle at 50% 55%, var(--amber1), var(--amber2) 60%, var(--amber3));
   box-shadow:inset 0 0 0 7px #1a1e1d}
.vglass.l .f{--curtain:linear-gradient(90deg, rgba(150,45,30,.88), rgba(180,70,45,.62) 55%, rgba(200,90,50,.15))}
.vglass.r .f{--curtain:linear-gradient(270deg, rgba(150,45,30,.88), rgba(180,70,45,.62) 55%, rgba(200,90,50,.15))}
#view.green .vglass.l .f{--curtain:linear-gradient(90deg, rgba(40,90,82,.88), rgba(70,120,110,.6) 55%, rgba(90,140,125,.12))}
#view.green .vglass.r .f{--curtain:linear-gradient(270deg, rgba(40,90,82,.88), rgba(70,120,110,.6) 55%, rgba(90,140,125,.12))}
#view.seen .vglass .f{background:
   linear-gradient(transparent calc(33% - 5px), #1a1e1d calc(33% - 5px) calc(33% + 5px), transparent calc(33% + 5px) calc(66% - 5px), #1a1e1d calc(66% - 5px) calc(66% + 5px), transparent calc(66% + 5px)),
   linear-gradient(90deg, transparent calc(50% - 5px), #1a1e1d calc(50% - 5px) calc(50% + 5px), transparent calc(50% + 5px)),
   linear-gradient(125deg, rgba(255,255,255,.22), rgba(255,255,255,0) 30%, rgba(255,255,255,.1) 48%, rgba(255,255,255,0) 60%)}
.vglass .b{transform:rotateY(180deg);background:#22282a;box-shadow:inset 0 0 0 7px #121514}
#vback{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:3;border:0;border-radius:99px;padding:9px 15px;font:800 14px Nunito,sans-serif;
  background:rgba(20,24,23,.82);color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(-8px);transition:.4s;pointer-events:none}
#view.carded #vback{opacity:1;transform:none;pointer-events:auto}
#vcard{position:absolute;left:16px;right:16px;top:50%;max-height:68vh;overflow:auto;margin:0 auto;max-width:420px;
  background:var(--paper);color:var(--ink);border-radius:16px;padding:20px 18px 16px;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(244,236,220,.9), 0 20px 50px rgba(0,0,0,.55);
  opacity:0;transform:translateY(-50%) scale(.85);transition:opacity .5s, transform .6s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
#view.carded #vcard{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
#vcard .day{font:800 12px Nunito,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--red)}
#vcard h2{font:800 25px "Playfair Display",Georgia,serif;margin:2px 0 10px;color:var(--fir)}
#vcard img{width:100%;border-radius:10px;display:block;margin:4px 0 12px}
#vcard img.qr{width:auto;max-width:240px;max-height:240px;margin:4px auto 12px;background:#fff;padding:10px;border-radius:8px}
#vcard .msg{font-size:17px;line-height:1.5;white-space:pre-wrap;margin:0 0 10px}
#vcard .lnk{display:inline-block;background:var(--fir);color:var(--cream);text-decoration:none;font-weight:800;padding:10px 16px;border-radius:99px;margin-bottom:6px;word-break:break-all}
#vcard .empty{opacity:.6;font-style:italic}

/* Modales */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(5,12,13,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{width:min(420px,100%);max-height:86vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:pop .35s cubic-bezier(.3,1.5,.5,1);position:relative;border:2px solid var(--gold);outline:6px solid var(--paper)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card .day{font:800 12px Nunito,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--red)}
.card h2{font:800 27px "Playfair Display",Georgia,serif;margin:2px 0 12px;color:var(--fir)}
.card img{width:100%;border-radius:10px;display:block;margin:6px 0 12px}
.card .msg{font-size:17px;line-height:1.5;white-space:pre-wrap;margin:0 0 12px}
.card .lnk{display:inline-block;background:var(--fir);color:var(--cream);text-decoration:none;font-weight:800;padding:10px 16px;border-radius:99px;margin-bottom:8px;word-break:break-all}
.card .empty{opacity:.6;font-style:italic}
.card .close{position:absolute;top:10px;right:12px;border:0;background:transparent;font-size:24px;color:var(--ink);opacity:.5}
.card label{display:block;font-weight:800;font-size:13px;margin:12px 0 5px}
.card textarea,.card input[type=text],.card input[type=url]{width:100%;border:2px solid #ddd0b6;border-radius:12px;padding:10px;font:16px Nunito,sans-serif;background:#fffaf0;color:var(--ink)}
.card textarea{min-height:90px;resize:vertical}
.card .row{display:flex;gap:8px;margin-top:16px}
.card .btn{flex:1;border:0;border-radius:99px;padding:12px;font:800 15px Nunito,sans-serif;background:#e6dac2;color:var(--ink)}
.card .btn.pri{background:var(--fir);color:var(--cream)}
.card .photoPrev{position:relative}
.card .photoPrev button{position:absolute;top:8px;right:8px;border:0;border-radius:99px;padding:5px 10px;background:rgba(0,0,0,.6);color:#fff;font:800 12px Nunito}
.card .hint{font-size:12px;opacity:.65;margin-top:4px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);z-index:20;background:var(--paper);color:var(--ink);padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Inicio, barra de edición y enlaces */
#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:var(--night1);font:700 20px "Playfair Display",Georgia,serif;color:var(--cream)}
#bar{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border-radius:18px;background:rgba(12,20,21,.85);backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.45);transition:opacity .4s;max-width:480px;margin:0 auto}
#bar button{border:0;border-radius:12px;padding:10px 2px;font:800 12px Nunito,sans-serif;background:rgba(243,234,215,.13);color:var(--cream)}
#bar button.gold{background:var(--gold);color:var(--ink)}
#home{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;max-width:420px;margin:0 auto;background:rgba(244,236,220,.97);color:var(--ink);border-radius:18px;padding:16px 16px 14px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);border:2px solid var(--gold);transition:opacity .4s}
#home h2{font:800 21px "Playfair Display",Georgia,serif;margin:0 0 6px;color:var(--fir)}
#home p{margin:0 0 12px;font-size:14px;line-height:1.45}
#home p.demo{margin:10px 0 0;font-size:12px;opacity:.65}
.bigbtn{border:0;border-radius:99px;padding:13px 20px;font:800 16px Nunito,sans-serif;background:var(--red);color:#fff;width:100%}
body.mode-edit footer,body.mode-home footer{display:none}
body.zoomed #bar,body.zoomed #home{opacity:0;pointer-events:none}
.linkbox{background:#fffaf0;border:2px dashed #d9c49a;border-radius:12px;padding:10px;font-size:13px;word-break:break-all;user-select:text;-webkit-user-select:text;margin:10px 0 4px}
.card .col{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.card .btn.wa{background:#1f9e55;color:#fff}
.card .msg.small{font-size:15px}
.card label.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.warn{background:#f6dcc9;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:#5a2416;margin-bottom:4px}
</style>

// ---------- enlaces (#editar-xxxx-yyyy  /  #regalo-xxxx) ----------
function parseHash(){
  var h = location.hash.replace(/^#/, ''), m;
  if ((m = h.match(/^editar-([a-z0-9]+)-([a-z0-9]+)$/))) return {mode: 'edit', gid: m[1], k: m[2]};
  if ((m = h.match(/^regalo-([a-z0-9]+)$/))) return {mode: 'gift', gid: m[1]};
  return {mode: 'home'};
}
function baseUrl(){ return location.href.split('#')[0]; }
function editUrl(){ return baseUrl() + '#editar-' + ROUTE.gid + '-' + ROUTE.k; }
function giftUrl(){ return baseUrl() + '#regalo-' + ROUTE.gid; }
function rid(n){
  var a = 'abcdefghijkmnpqrstuvwxyz23456789', s = '', r = new Uint32Array(n);
  crypto.getRandomValues(r);
  for (var i = 0; i < n; i++) s += a[r[i] % a.length];
  return s;
}

// ---------- almacén de datos ----------
function demoStore(){
  function key(g){ return 'adviento-demo-' + g; }
  function get(g){ try { return JSON.parse(localStorage.getItem(key(g))); } catch(e){ return null; } }
  function put(g, v){ localStorage.setItem(key(g), JSON.stringify(v)); }
  return {
    create: function(meta){ var g = rid(12), k = rid(24); put(g, {k: k, meta: meta, days: {}}); return Promise.resolve({gid: g, k: k}); },
    load: function(g){ var v = get(g); return Promise.resolve(v ? {meta: v.meta, days: v.days} : null); },
    claim: function(g, k){ var v = get(g); return (v && v.k === k) ? Promise.resolve() : Promise.reject(new Error('clave')); },
    saveMeta: function(g, meta){ return new Promise(function(ok){ var v = get(g); v.meta = meta; put(g, v); ok(); }); },
    saveDay: function(g, n, c){ return new Promise(function(ok){ var v = get(g); if (c) v.days[n] = c; else delete v.days[n]; put(g, v); ok(); }); }
  };
}
function fireStore(){
  var B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var ready = Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-firestore.js'), import(B + 'firebase-auth.js')]).then(function(m){
    var app = m[0].initializeApp(FIREBASE_CONFIG);
    return {F: m[1], A: m[2], db: m[1].getFirestore(app), auth: m[2].getAuth(app)};
  });
  function user(x){
    return x.auth.authStateReady().then(function(){
      return x.auth.currentUser || x.A.signInAnonymously(x.auth).then(function(c){ return c.user; });
    });
  }
  return {
    create: function(meta){
      return ready.then(function(x){ return user(x).then(function(u){
        var F = x.F, g = rid(12), k = rid(24), b = F.writeBatch(x.db);
        b.set(F.doc(x.db, 'keys', g), {k: k});
        b.set(F.doc(x.db, 'claims', g + '_' + u.uid), {gid: g, k: k});
        b.set(F.doc(x.db, 'calendars', g), {title: meta.title, subtitle: meta.subtitle, created: F.serverTimestamp()});
        return b.commit().then(function(){ return {gid: g, k: k}; });
      }); });
    },
    load: function(g){
      return ready.then(function(x){
        var F = x.F;
        return F.getDoc(F.doc(x.db, 'calendars', g)).then(function(s){
          if (!s.exists()) return null;
          return F.getDocs(F.collection(x.db, 'calendars', g, 'days')).then(function(q){
            var days = {}; q.forEach(function(d){ days[d.id] = d.data(); });
            var m = s.data();
            return {meta: {title: m.title || '', subtitle: m.subtitle || ''}, days: days};
          });
        });
      });
    },
    claim: function(g, k){
      return ready.then(function(x){ return user(x).then(function(u){
        // Si este dispositivo ya estaba autorizado, Firebase lo rechaza y no pasa nada.
        return x.F.setDoc(x.F.doc(x.db, 'claims', g + '_' + u.uid), {gid: g, k: k}).catch(function(){});
      }); });
    },
    saveMeta: function(g, meta){
      return ready.then(function(x){ return x.F.updateDoc(x.F.doc(x.db, 'calendars', g), {title: meta.title, subtitle: meta.subtitle}); });
    },
    saveDay: function(g, n, c){
      return ready.then(function(x){
        var ref = x.F.doc(x.db, 'calendars', g, 'days', String(n));
        return c ? x.F.setDoc(ref, c) : x.F.deleteDoc(ref);
      });
    }
  };
}

    house.style.left = (-W / 2) + 'px';
    house.style.top = (-H / 2 + Rm / 2) + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('.wall'), function(el){
      el.style.transform = 'rotateY(' + (el.dataset.face * 90) + 'deg) translateZ(' + (W / 2) + 'px)';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.roof'), function(el){
      el.style.transform = 'rotateY(' + (el.dataset.face * 90) + 'deg) translateZ(' + half + 'px) rotateX(' + phi + 'deg)';
    });
    var rt = $('rtop');
    rt.style.cssText = 'width:' + (2 * top) + 'px;height:' + (2 * top) + 'px;left:' + (W / 2 - top) + 'px;top:' + (-Rm - top) + 'px;transform:rotateX(90deg)';
    // chimeneas sobre la parte plana del tejado
    Array.prototype.forEach.call(document.querySelectorAll('.chim'), function(el){
      var c = CHIMS[el.dataset.i], cw = W * 0.1, ch = W * c[2];
      el.style.cssText = 'left:' + (W / 2 + c[0] * W - cw / 2) + 'px;top:' + (-Rm - ch) + 'px;width:' + cw + 'px;height:' + ch + 'px;transform:translateZ(' + (c[1] * W) + 'px)';
      Array.prototype.forEach.call(el.querySelectorAll('.cf'), function(f, k){ f.style.transform = 'rotateY(' + (k * 90) + 'deg) translateZ(' + (cw / 2) + 'px)'; });
      var cap = el.querySelector('.cap'); cap.style.cssText = 'width:' + (cw + 6) + 'px;height:' + (cw + 6) + 'px;left:-3px;top:' + (-(cw + 6) / 2) + 'px;transform:rotateX(90deg)';
    });
    Array.prototype.forEach.call(propEls, function(el, i){
      var p = PROPS[i], th = W * p.h, tw = th * (p.k === 'lamp' ? 40 / 160 : p.k === 'p' ? 40 / 100 : 100 / 140);
      el.style.width = tw + 'px'; el.style.height = th + 'px';
      el.style.left = (W / 2 - tw / 2) + 'px'; el.style.top = (H - th) + 'px';
    });
    $('stage').style.transform = 'scale(' + scale + ')';
  }
  layout();
  addEventListener('resize', layout);

  // ---------- rotación ----------
  var rx = -12, ry = -28, vel = 0, dragging = false, touched = false, t0 = performance.now(), lastT = t0;
  var walls = document.querySelectorAll('.wall'), roofs = document.querySelectorAll('.roof');
  function applyRot(dt){
    $('house').style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    for (var k = 0; k < 4; k++){
      var dot = Math.cos((k * 90 + ry + 30) * Math.PI / 180);
      var sh = Math.max(0, Math.min(1, 0.5 - 0.5 * dot));
      walls[k].lastElementChild.style.opacity = (sh * 0.45).toFixed(3);
      roofs[k].lastElementChild.style.opacity = (sh * 0.4).toFixed(3);
    }
    var bb = ' rotateY(' + (-ry).toFixed(2) + 'deg)';
    for (var i = 0; i < propEls.length; i++){
      var p = PROPS[i];
      if (p.sp) p.a += p.sp * dt / 16;
      var a = p.a * Math.PI / 180;
      var flip = p.sp ? ((Math.cos((p.a + ry) * Math.PI / 180) * p.sp) < 0 ? ' scaleX(-1)' : '') : '';
      propEls[i].style.transform = 'translate3d(' + (Math.sin(a) * p.r * W).toFixed(1) + 'px,0,' + (Math.cos(a) * p.r * W).toFixed(1) + 'px)' + bb + flip;
    }
  }
  var anim = null, busy = false;
  function animateTo(rx1, ry1, dur, cb){
    var rx0 = rx, ry0 = ry, st = performance.now();
    anim = function(t){
      var p = Math.min(1, (t - st) / dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      rx = rx0 + (rx1 - rx0) * e; ry = ry0 + (ry1 - ry0) * e;
      if (p >= 1){ anim = null; if (cb) cb(); }
    };
  }
  function tick(t){
    var dt = Math.min(50, t - lastT); lastT = t;
    if (anim) anim(t);
    else if (!dragging){
      if (!touched) ry = -28 + Math.sin((t - t0) / 2200) * 22;
      else if (Math.abs(vel) > 0.01){ ry += vel; vel *= 0.94; }
    }
    applyRot(dt);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var scene = $('scene'), sx, sy, lx, ly, lt, moved, downTarget;
  scene.addEventListener('pointerdown', function(e){
    if (busy) return;
    dragging = true; moved = false; sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now(); vel = 0; downTarget = e.target;
  });
  addEventListener('pointermove', function(e){
    if (!dragging) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 6){ moved = true; touched = true; }
    if (moved){
      ry += dx * 0.45; rx = Math.max(-38, Math.min(8, rx - dy * 0.25));
      var nt = performance.now(); vel = dx * 0.45 * Math.min(1, 16 / Math.max(1, nt - lt)); lt = nt;
    }
    lx = e.clientX; ly = e.clientY;
  });
  addEventListener('pointerup', function(){
    if (!dragging) return; dragging = false;
    if (!moved && downTarget){ var w = downTarget.closest && downTarget.closest('.win'); if (w) onWindow(w); }
  });
  addEventListener('pointercancel', function(){ dragging = false; });

  // ---------- abrir ventanas ----------
  var toastTimer;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
  function fecha(d){ return d + ' de diciembre'; }

  function onWindow(w){
    var d = +w.dataset.day;
    if (MODE === 'home'){ toast('Pulsa «Crear mi calendario» para empezar ✨'); return; }
    if (MODE === 'edit' && !PREVIEW){ openEditor(d); return; }
    if (!canOpen(d)){
      w.classList.remove('wiggle'); void w.offsetWidth; w.classList.add('wiggle');
      var n = daysUntil(d);
      toast('🔒 Se abre el ' + fecha(d) + (n > 0 ? ' · faltan ' + n + (n === 1 ? ' día' : ' días') : ''));
      return;
    }
    if (MODE === 'gift'){
      w.classList.remove('today');
      if (opened.indexOf(d) < 0){ opened.push(d); saveOpened(opened); }
      playWindow(w, d, null);
    } else {
      playWindow(w, d, function(){});
    }
  }

  // ---------- zoom a la ventana, cristales que se abren y habitación ----------
  var current = null;
  function contentHTML(c, d){
    var h = '';
    if (c.img) h += '<img src="' + c.img + '" alt=""' + (c.qr ? ' class="qr"' : '') + '>';
    if (c.text) h += '<p class="msg">' + esc(c.text) + '</p>';
    if (c.url) h += '<a class="lnk" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.urlLabel || 'Abrir enlace') + ' ↗</a>';
    if (!c.img && !c.text && !c.url) h += '<p class="msg empty">Aquí todavía no hay sorpresa… ✨</p>';
    return h;
  }
  function playWindow(w, d, preview){
    busy = true; touched = true; vel = 0; dragging = false;
    var face = +w.closest('.wall').dataset.face;
    var target = -face * 90; target += 360 * Math.round((ry - target) / 360);
    animateTo(-3, target, 700, function(){
      requestAnimationFrame(function(){
        var r = w.querySelector('.room').getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var k = Math.max(innerWidth / r.width, innerHeight / r.height) * 1.15;
        document.body.classList.add('zoomed');
        scene.style.transition = 'transform .95s cubic-bezier(.65,0,.35,1)';
        scene.style.transformOrigin = cx + 'px ' + cy + 'px';
        scene.style.transform = 'translate(' + (innerWidth / 2 - cx) + 'px,' + (innerHeight / 2 - cy) + 'px) scale(' + k + ')';
        setTimeout(function(){ openView(w, d, preview); }, 820);
      });
    });
  }
  function openView(w, d, preview){
    var v = $('view');
    $('vroom').innerHTML = roomSVG((d - 1) % 6);
    $('vcard').innerHTML = contentHTML(DATA.days[d] || {}, d);
    $('vcard').scrollTop = 0;
    var face = +w.closest('.wall').dataset.face;
    v.className = 'show' + (face === 1 || face === 3 ? ' green' : '');
    current = {w: w, d: d, preview: preview};
    setTimeout(function(){ v.classList.add('opening'); }, 380);
    setTimeout(function(){ v.classList.add('carded'); }, 1350);
  }
  function closeView(){
    if (!current) return;
    var v = $('view'), cur = current; current = null;
    v.classList.remove('carded');
    setTimeout(function(){ v.classList.add('seen'); v.classList.remove('opening'); }, 250);
    setTimeout(function(){ if (!cur.preview) cur.w.classList.add('open'); v.classList.add('fading'); }, 1350);
    setTimeout(function(){ v.className = ''; scene.style.transform = 'none'; document.body.classList.remove('zoomed'); }, 1720);
    setTimeout(function(){ scene.style.transition = ''; busy = false; if (cur.preview) cur.preview(); }, 2700);
  }
  $('vback').addEventListener('click', closeView);

  function openCard(h){ if (onCardClose){ var f = onCardClose; onCardClose = null; f(); } $('card').innerHTML = h; $('overlay').classList.add('show'); }
  var onCardClose = null;
  function closeCard(){ $('overlay').classList.remove('show'); if (onCardClose){ var f = onCardClose; onCardClose = null; f(); } }
  $('overlay').addEventListener('click', function(e){ if (e.target.id === 'overlay' || e.target.hasAttribute('data-close')) closeCard(); });


  // ---------- cabecera y estado de las ventanas ----------
  var saveState = '';
  function setSave(s){ saveState = s; renderHeader(); }
  function renderHeader(){
    $('title').textContent = DATA.meta.title || 'Calendario de Adviento';
    $('subtitle').textContent = DATA.meta.subtitle || '';
    var s, td = todayDay();
    if (MODE === 'home') s = 'Crea el tuyo y regálalo 🎁';
    else if (MODE === 'edit') s = PREVIEW ? '👀 Vista previa: toca cualquier ventana' :
      '✏️ Modo edición' + (saveState === 'saving' ? ' · Guardando…' : saveState === 'saved' ? ' · Guardado ✓' : saveState === 'error' ? ' · ⚠️ Sin guardar' : '');
    else if (now < unlockDate(1)){ var n = daysUntil(1); s = n === 1 ? '¡Mañana se abre la primera ventana!' : 'Faltan ' + n + ' días para la primera ventana'; }
    else if (td) s = 'Hoy toca abrir la ventana ' + td + ' ✨';
    else s = '¡Feliz Navidad! Ya puedes abrirlas todas';
    if (DEMO && MODE !== 'gift') s += ' · demo';
    $('status').textContent = s;
  }
  function insideHTML(c){
    return c.img ? '<div class="thumb' + (c.qr ? ' qr' : '') + '" style="background-image:url(' + c.img + ')"></div>'
         : (c.text || c.url) ? '<div class="note' + (!c.text ? ' link' : '') + '"></div>' : '';
  }
  function refreshWindows(){
    var td = todayDay();
    Array.prototype.forEach.call(document.querySelectorAll('.win'), function(w){
      var d = +w.dataset.day, c = DATA.days[d], open = false;
      if (MODE === 'gift') open = opened.indexOf(d) >= 0 && dayArrived(d);
      if (MODE === 'edit') open = hasC(c);
      w.classList.toggle('open', open);
      w.classList.toggle('today', MODE === 'gift' && d === td && !open);
    });
  }
  function refreshWin(d){
    var w = document.querySelector('.win[data-day="' + d + '"]');
    if (w) w.querySelector('.room').innerHTML = insideHTML(DATA.days[d] || {});
    refreshWindows();
  }
  renderHeader();
  refreshWindows();

  // ---------- inicio: crear un calendario ----------
  if (MODE === 'home'){
    $('bCreate').addEventListener('click', function(){
      var b = this; b.disabled = true; b.textContent = 'Creando…';
      Store.create(DATA.meta).then(function(r){
        try { sessionStorage.setItem('adviento-nuevo', '1'); } catch(e){}
        location.hash = '#editar-' + r.gid + '-' + r.k;
      }).catch(function(e){
        console.error(e); b.disabled = false; b.textContent = '✨ Crear mi calendario';
        toast('No se ha podido crear. Revisa tu conexión y vuelve a intentarlo.');
      });
    });
  }

  // ---------- modo edición ----------
  if (MODE === 'edit'){
    $('bTitle').addEventListener('click', titleCard);
    $('bEdit').addEventListener('click', function(){ linkCard('edit', false); });
    $('bGift').addEventListener('click', function(){ linkCard('gift', false); });
    $('bPrev').addEventListener('click', function(){
      PREVIEW = !PREVIEW;
      this.textContent = PREVIEW ? '✏️ Editar' : '👀 Vista previa';
      document.body.classList.toggle('preview', PREVIEW);
      if (PREVIEW) Array.prototype.forEach.call(document.querySelectorAll('.win'), function(w){ w.classList.add('open'); });
      else refreshWindows();
      renderHeader();
      toast(PREVIEW ? 'Así lo verá quien lo reciba, con todas las ventanas abiertas' : 'De vuelta al modo edición');
    });
    var isNew = false;
    try { isNew = sessionStorage.getItem('adviento-nuevo') === '1'; sessionStorage.removeItem('adviento-nuevo'); } catch(e){}
    if (isNew) setTimeout(function(){ linkCard('edit', true); }, 600);
  }

  function saveError(e){
    console.error(e); setSave('error');
    toast(DEMO ? 'No cabe en el modo demo (prueba con una foto más pequeña)' : 'No se ha podido guardar. Revisa tu conexión y que el enlace de edición esté completo.');
  }

  function openEditor(d){
    var c = DATA.days[d] || {}, img = c.img || null, timer = null, dirty = false;
    openCard('<button class="close" data-close>×</button><div class="day">' + fecha(d) + '</div><h2>Ventana ' + d + '</h2>' +
      (dayArrived(d) ? '<div class="warn">Este día ya ha llegado: si lo cambias, quien lo reciba verá el contenido nuevo.</div>' : '') +
      '<label>Mensaje o nota</label><textarea id="eText" placeholder="Escribe algo bonito…">' + esc(c.text) + '</textarea>' +
      '<label>Foto o código QR</label><div id="ePhoto"></div><input type="file" id="eFile" accept="image/*">' +
      '<label class="chk"><input type="checkbox" id="eQr"' + (c.qr ? ' checked' : '') + '> Es un código QR (se muestra entero, sin recortar)</label>' +
      '<label>Enlace (opcional)</label><input type="url" id="eUrl" placeholder="https://…" value="' + esc(c.url) + '">' +
      '<input type="text" id="eUrlLabel" style="margin-top:6px" placeholder="Texto del botón (p. ej. «Escucha esta canción»)" value="' + esc(c.urlLabel) + '">' +
      '<div class="hint">Se guarda solo mientras escribes.</div>' +
      '<div class="row"><button class="btn" id="ePrev">Ver cómo queda</button><button class="btn pri" id="eDone">Listo</button></div>');
    function renderPhoto(){
      $('ePhoto').innerHTML = img ? '<div class="photoPrev"><img src="' + img + '" alt=""><button id="eDel">Quitar</button></div>' : '';
      var del = $('eDel'); if (del) del.addEventListener('click', function(){ img = null; renderPhoto(); touch(); });
    }
    function collect(){
      var o = {}, t = $('eText').value.trim(), u = $('eUrl').value.trim(), ul = $('eUrlLabel').value.trim();
      if (t) o.text = t;
      if (img){ o.img = img; if ($('eQr').checked) o.qr = true; }
      if (u){ if (!/^https?:\/\//i.test(u)) u = 'https://' + u; o.url = u; if (ul) o.urlLabel = ul; }
      return o;
    }
    function commit(){
      clearTimeout(timer);
      if (!dirty) return;
      dirty = false;
      var o = collect(), has = hasC(o);
      if (has) DATA.days[d] = o; else delete DATA.days[d];
      refreshWin(d);
      setSave('saving');
      Store.saveDay(ROUTE.gid, d, has ? o : null).then(function(){ setSave('saved'); }).catch(saveError);
    }
    function touch(){ dirty = true; setSave('saving'); clearTimeout(timer); timer = setTimeout(commit, 800); }
    renderPhoto();
    ['eText', 'eUrl', 'eUrlLabel'].forEach(function(id){ $(id).addEventListener('input', touch); });
    $('eQr').addEventListener('change', touch);
    $('eFile').addEventListener('change', function(e){
      var f = e.target.files[0]; if (!f) return;
      toast('Preparando la foto…');
      compress(f, function(url){ img = url; renderPhoto(); touch(); }, function(){ toast('No se ha podido leer esa imagen'); });
    });
    $('ePrev').addEventListener('click', function(){
      commit(); onCardClose = null; closeCard();
      playWindow(document.querySelector('.win[data-day="' + d + '"]'), d, function(){ openEditor(d); });
    });
    $('eDone').addEventListener('click', closeCard);
    onCardClose = commit;
  }

  function titleCard(){
    openCard('<button class="close" data-close>×</button><div class="day">Ajustes</div><h2>Título del calendario</h2>' +
      '<label>Título</label><input type="text" id="tT" value="' + esc(DATA.meta.title) + '">' +
      '<label>Subtítulo</label><input type="text" id="tS" value="' + esc(DATA.meta.subtitle) + '">' +
      '<div class="row"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="tSave">Guardar</button></div>');
    $('tSave').addEventListener('click', function(){
      DATA.meta = {title: $('tT').value.trim(), subtitle: $('tS').value.trim()};
      renderHeader(); closeCard(); setSave('saving');
      Store.saveMeta(ROUTE.gid, DATA.meta).then(function(){ setSave('saved'); }).catch(saveError);
    });
  }

  function linkCard(kind, isNew){
    var url = kind === 'edit' ? editUrl() : giftUrl();
    var msg = kind === 'edit' ? 'Enlace para editar mi calendario de Adviento (no lo compartas): ' + url
                              : 'Te he preparado un calendario de Adviento 🎄 Del 1 al 25 de diciembre podrás abrir una ventana cada día: ' + url;
    var subj = kind === 'edit' ? 'Mi enlace de edición del calendario de Adviento' : 'Tu calendario de Adviento 🎄';
    var h = '<button class="close" data-close>×</button>';
    if (kind === 'edit') h += '<div class="day">' + (isNew ? '¡Tu calendario está creado!' : 'Solo para ti') + '</div><h2>🔒 Tu enlace de edición</h2>' +
      '<p class="msg small">Guárdalo bien: es la única forma de volver a editar tu calendario, desde este u otro dispositivo. <b>No se lo envíes</b> a la persona a la que se lo regalas.</p>';
    else h += '<div class="day">Para regalar</div><h2>🎁 Enlace de regalo</h2>' +
      '<p class="msg small">Envíaselo a quien quieras. Solo podrá ver el calendario y abrir cada ventana en su día. Puedes enviarlo ya y seguir rellenando ventanas después.</p>';
    h += '<div class="linkbox">' + esc(url) + '</div><div class="col">' +
      '<button class="btn pri" id="lCopy">Copiar enlace</button>' +
      '<a class="btn wa" href="https://wa.me/?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">' + (kind === 'edit' ? 'Enviármelo por WhatsApp' : 'Enviar por WhatsApp') + '</a>' +
      '<a class="btn" href="mailto:?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(msg) + '">' + (kind === 'edit' ? 'Enviármelo por email' : 'Enviar por email') + '</a></div>';
    if (DEMO) h += '<div class="hint" style="margin-top:10px">Modo demo: este enlace solo funciona en este dispositivo.</div>';
    if (isNew) h += '<div class="row"><button class="btn" data-close>Ya lo he guardado</button></div>';
    openCard(h);
    $('lCopy').addEventListener('click', function(){ copyText(url); });
  }
  function copyText(t){
    function fallback(){
      var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
      document.body.appendChild(a); a.select();
      try { document.execCommand('copy'); toast('Enlace copiado'); } catch(e){ toast('Mantén pulsado el enlace para copiarlo'); }
      a.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast('Enlace copiado'); }, fallback);
    else fallback();
  }

  // Fotos: se reducen para que quepan de sobra (máx. ~700 KB por ventana)
  function compress(file, ok, ko){
    var r = new FileReader();
    r.onerror = ko;
    r.onload = function(){
      var im = new Image();
      im.onerror = ko;
      im.onload = function(){
        var tries = [[1000, .8], [850, .7], [700, .6], [560, .55]], url = '';
        for (var i = 0; i < tries.length; i++){
          var s = Math.min(1, tries[i][0] / Math.max(im.width, im.height));
          var cv = document.createElement('canvas'); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
          var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
          url = cv.toDataURL('image/jpeg', tries[i][1]);
          if (url.length < 700000) break;
        }
        ok(url);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  }

  // ---------- nieve ----------
  (function(){
    var cv = $('snow'), ctx = cv.getContext('2d'), flakes = [], dpr = Math.min(2, devicePixelRatio || 1);
    function size(){ cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
    size(); addEventListener('resize', size);
    for (var i = 0; i < 170; i++) flakes.push({x: Math.random(), y: Math.random(), r: Math.random() * 2.4 + .5, s: Math.random() * .4 + .15, w: Math.random() * 6.28, o: Math.random() * .5 + .45});
    function draw(){
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var i = 0; i < flakes.length; i++){
        var f = flakes[i]; f.y += f.s / 420 * (1 + f.r); f.w += .01; if (f.y > 1.02){ f.y = -.02; f.x = Math.random(); }
        ctx.globalAlpha = f.o; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc((f.x + Math.sin(f.w) * .01) * cv.width, f.y * cv.height, f.r * dpr, 0, 6.28); ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();
  })();

  var l = $('loading'); if (l) l.remove();
}

boot();

})();
</script>
</body>
